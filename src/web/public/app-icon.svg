<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="45%" stop-color="#0f0e17"/>
      <stop offset="100%" stop-color="#050508"/>
    </radialGradient>

    <!-- Outer Rim Gradient -->
    <linearGradient id="rim-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Primary Accent Gradient (Indigo -> Violet -> Pink) -->
    <linearGradient id="brand-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>

    <!-- Secondary Cyan/Emerald Signal Gradient -->
    <linearGradient id="signal-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>

    <!-- Shield Fill Gradient -->
    <linearGradient id="shield-fill" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#312e81"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glass Surface Gradient -->
    <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="35%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="shadow-hero" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#4f46e5" flood-opacity="0.45"/>
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#22d3ee" flood-opacity="0.8"/>
    </filter>

    <filter id="shield-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#a855f7" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base App Icon Container (macOS Standard Squircle rx=228, ry=228) -->
  <rect x="32" y="32" width="960" height="960" rx="220" ry="220" fill="url(#bg-glow)"/>

  <!-- Subtle Outer Border/Rim Highlight -->
  <rect x="32" y="32" width="960" height="960" rx="220" ry="220" fill="none" stroke="url(#rim-gradient)" stroke-width="6"/>

  <!-- Top Glass Highlight Arc -->
  <path d="M 120 32 L 904 32 C 980 32 1024 76 1024 152 L 1024 450 C 700 480 320 400 32 650 L 32 152 C 32 76 76 32 120 32 Z" fill="url(#glass-glare)" opacity="0.7"/>

  <!-- Background Ambient Glow Orbs -->
  <circle cx="512" cy="420" r="320" fill="#6366f1" opacity="0.15" filter="blur(60px)"/>
  <circle cx="340" cy="620" r="220" fill="#06b6d4" opacity="0.12" filter="blur(50px)"/>
  <circle cx="680" cy="620" r="220" fill="#ec4899" opacity="0.12" filter="blur(50px)"/>

  <!-- MAIN HERO GROUP -->
  <g filter="url(#shadow-hero)">

    <!-- Router Outer Hexagonal Circuit Mesh (Behind Shield) -->
    <!-- Hexagon Frame -->
    <polygon points="512,180 780,335 780,645 512,800 244,645 244,335" 
             fill="none" 
             stroke="url(#brand-gradient)" 
             stroke-width="12" 
             stroke-linejoin="round"
             opacity="0.85"/>

    <polygon points="512,216 750,353 750,627 512,764 274,627 274,353" 
             fill="none" 
             stroke="#a855f7" 
             stroke-width="3" 
             stroke-dasharray="16 12"
             opacity="0.5"/>

    <!-- Routing Connection Lines from Center to Hexagon Vertices -->
    <line x1="512" y1="490" x2="512" y2="180" stroke="url(#signal-gradient)" stroke-width="8" stroke-dasharray="12 8"/>
    <line x1="512" y1="490" x2="780" y2="335" stroke="url(#brand-gradient)" stroke-width="8" stroke-dasharray="12 8"/>
    <line x1="512" y1="490" x2="780" y2="645" stroke="url(#signal-gradient)" stroke-width="8" stroke-dasharray="12 8"/>
    <line x1="512" y1="490" x2="512" y2="800" stroke="url(#brand-gradient)" stroke-width="8" stroke-dasharray="12 8"/>
    <line x1="512" y1="490" x2="244" y2="645" stroke="url(#signal-gradient)" stroke-width="8" stroke-dasharray="12 8"/>
    <line x1="512" y1="490" x2="244" y2="335" stroke="url(#brand-gradient)" stroke-width="8" stroke-dasharray="12 8"/>

    <!-- Vertex Router Nodes (Circles at key intersection points) -->
    <g filter="url(#node-glow)">
      <!-- Top Node -->
      <circle cx="512" cy="180" r="22" fill="#06b6d4"/>
      <circle cx="512" cy="180" r="10" fill="#ffffff"/>

      <!-- Top-Right Node -->
      <circle cx="780" cy="335" r="22" fill="#a855f7"/>
      <circle cx="780" cy="335" r="10" fill="#ffffff"/>

      <!-- Bottom-Right Node -->
      <circle cx="780" cy="645" r="22" fill="#ec4899"/>
      <circle cx="780" cy="645" r="10" fill="#ffffff"/>

      <!-- Bottom Node -->
      <circle cx="512" cy="800" r="22" fill="#6366f1"/>
      <circle cx="512" cy="800" r="10" fill="#ffffff"/>

      <!-- Bottom-Left Node -->
      <circle cx="244" cy="645" r="22" fill="#10b981"/>
      <circle cx="244" cy="645" r="10" fill="#ffffff"/>

      <!-- Top-Left Node -->
      <circle cx="244" cy="335" r="22" fill="#3b82f6"/>
      <circle cx="244" cy="335" r="10" fill="#ffffff"/>
    </g>

    <!-- CENTER SECURITY SHIELD -->
    <g filter="url(#shield-glow)">
      <!-- Outer Shield Glow Border -->
      <path d="M 512 250 
               C 620 250, 680 290, 710 320 
               C 710 490, 670 650, 512 730 
               C 354 650, 314 490, 314 320 
               C 344 290, 404 250, 512 250 Z" 
            fill="url(#shield-fill)" 
            stroke="url(#brand-gradient)" 
            stroke-width="16" 
            stroke-linejoin="round"/>

      <!-- Inner Shield Accent Rim -->
      <path d="M 512 280 
               C 600 280, 650 312, 678 338 
               C 678 480, 642 615, 512 688 
               C 382 615, 346 480, 346 338 
               C 374 312, 424 280, 512 280 Z" 
            fill="none" 
            stroke="#ffffff" 
            stroke-opacity="0.25" 
            stroke-width="4"/>

      <!-- Central Checkmark / Gateway Vector inside Shield -->
      <path d="M 425 480 L 485 540 L 605 400" 
            fill="none" 
            stroke="url(#signal-gradient)" 
            stroke-width="32" 
            stroke-linecap="round" 
            stroke-linejoin="round"/>

      <!-- Shield Highlight Reflection -->
      <path d="M 512 250 C 620 250, 680 290, 710 320 C 710 490, 670 650, 512 730 Z" 
            fill="url(#glass-glare)" 
            opacity="0.4"/>
    </g>

    <!-- Dynamic Signal Pulse Rings (Active MCP Gateway) -->
    <circle cx="512" cy="490" r="160" fill="none" stroke="#22d3ee" stroke-width="4" stroke-dasharray="8 16" opacity="0.6"/>
    <circle cx="512" cy="490" r="210" fill="none" stroke="#e879f9" stroke-width="3" stroke-dasharray="12 24" opacity="0.4"/>

  </g>
</svg>
