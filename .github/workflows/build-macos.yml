name: Build macOS Desktop App

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name (e.g. v1.0.2)'
        required: false

permissions:
  contents: write

jobs:
  build:
    name: Build macOS (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Determine Tag and Version
        id: get_tag
        run: |
          TAG="${{ github.event.release.tag_name || github.event.inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.get_tag.outputs.tag }}

      - name: Setup Node.js & Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Sync Version
        run: bun scripts/sync-version.ts ${{ steps.get_tag.outputs.version }}

      - name: Install dependencies
        run: |
          bun install
          cd src/web && bun install

      - name: Build Desktop App
        run: bun run build:desktop

      - name: Upload DMG to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DMG_PATH=$(find src-tauri/target -name "*.dmg" | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "Error: No DMG file found in src-tauri/target"
            exit 1
          fi
          echo "Found DMG artifact at $DMG_PATH"
          gh release upload "${{ steps.get_tag.outputs.tag }}" "$DMG_PATH" --clobber
