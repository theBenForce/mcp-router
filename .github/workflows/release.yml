name: Release & Build

on:
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  test:
    name: Run Verification Tests
    runs-on: ubuntu-latest
    env:
      DATABASE_PATH: ":memory:"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup mise (Bun & Rust)
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web frontend assets
        run: cd src/web && bun install --frozen-lockfile && bun run build

      - name: Run unit and integration tests
        run: bun test

  semantic-release:
    name: Evaluate & Create Release
    needs: test
    runs-on: ubuntu-latest
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}
      new_release_git_tag: ${{ steps.semantic.outputs.new_release_git_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup mise (Bun & Rust)
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Run semantic-release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

  build-macos:
    name: Build macOS Apple Silicon DMG
    needs: semantic-release
    if: needs.semantic-release.outputs.new_release_published == 'true'
    runs-on: macos-14
    steps:
      - name: Checkout tag commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.semantic-release.outputs.new_release_git_tag }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup mise (Bun & Rust)
        uses: jdx/mise-action@v2
        with:
          cache: true

      - name: Cache Rust compilation build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Sync Version to Tag
        run: |
          TAG="${{ needs.semantic-release.outputs.new_release_git_tag }}"
          VERSION="${TAG#v}"
          bun scripts/sync-version.ts "$VERSION"

      - name: Install root dependencies
        run: bun install --frozen-lockfile

      - name: Install web dependencies
        run: cd src/web && bun install --frozen-lockfile

      - name: Create sidecar binary directory
        run: mkdir -p src-tauri/bin

      - name: Import Apple Signing Certificate (if configured)
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "No APPLE_CERTIFICATE secret set, skipping certificate import."
            exit 0
          fi
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain-db
          echo "$APPLE_CERTIFICATE" | base64 -d > $RUNNER_TEMP/certificate.p12
          security create-keychain -p "buildkeychain" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "buildkeychain" $KEYCHAIN_PATH
          security import $RUNNER_TEMP/certificate.p12 -k $KEYCHAIN_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "buildkeychain" $KEYCHAIN_PATH
          security default-keychain -s $KEYCHAIN_PATH
          security list-keychains -s $KEYCHAIN_PATH

      - name: Build Desktop App (macOS Apple Silicon DMG)
        env:
          APPLE_SIGNING_IDENTITY: "${{ secrets.APPLE_SIGNING_IDENTITY || 'Apple Development: benforce@gmail.com (4NJVFBXFZV)' }}"
        run: bun run build:desktop

      - name: Verify DMG asset exists
        run: ls -la src-tauri/target/release/bundle/dmg/*.dmg || ls -la src-tauri/target/**/bundle/dmg/*.dmg

      - name: Attach DMG to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.semantic-release.outputs.new_release_git_tag }}"
          DMG_PATH=$(find src-tauri/target -name "*.dmg" | head -n 1)
          if [ -z "$DMG_PATH" ]; then
            echo "Error: No DMG file found in src-tauri/target"
            exit 1
          fi
          echo "Uploading DMG asset $DMG_PATH to GitHub release ${TAG}..."
          gh release upload "${TAG}" "$DMG_PATH" --clobber
